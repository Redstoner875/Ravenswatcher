name: Build and release Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Choose release tag
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" = tag ]; then
            [ "$REF_NAME" = "v$version" ] || { echo "Tag must match package.json: v$version"; exit 1; }
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "title=Ravenswatcher $version" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v$version-build.$RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "title=Ravenswatcher $version — build $RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Windows x64 ZIP
        run: npm run dist -- --win zip --x64 --publish never

      - name: Keep build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ravenswatcher-Windows-x64-${{ steps.release.outputs.tag }}
          path: build/release/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish release and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          files=(../build/release/*.zip)
          [ "${#files[@]}" -gt 0 ] || { echo 'No Windows ZIP was built'; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "$COMMIT_SHA" --title "$RELEASE_TITLE" \
              --generate-notes "${flags[@]}"
          fi
          echo "### Windows download" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
