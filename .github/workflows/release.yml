name: Build and release Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Choose release tag
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$REF_TYPE" = tag ]; then
            [ "$REF_NAME" = "v$version" ] || { echo "Tag must match package.json: v$version"; exit 1; }
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "title=Ravenswatcher $version" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            build_version="$version-beta.$RUN_NUMBER"
            npm version "$build_version" --no-git-tag-version
            echo "tag=v$build_version" >> "$GITHUB_OUTPUT"
            echo "title=Ravenswatcher $version — build $RUN_NUMBER" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build Windows x64 installer and ZIP
        run: npm run dist -- --win nsis zip --x64 --publish never

      - name: Prepare updater metadata
        env:
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          test -s ../build/release/latest.yml
          if [ "$PRERELEASE" = true ]; then
            cp ../build/release/latest.yml ../build/release/beta.yml
          fi

      - name: Keep build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ravenswatcher-Windows-x64-${{ steps.release.outputs.tag }}
          path: |
            build/release/*.zip
            build/release/*-Setup.exe
            build/release/*.blockmap
            build/release/latest.yml
            build/release/beta.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish release and update files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          files=(../build/release/*.zip ../build/release/*-Setup.exe ../build/release/*.blockmap)
          for candidate in ../build/release/latest.yml ../build/release/beta.yml; do
            if [ -f "$candidate" ]; then files+=("$candidate"); fi
          done
          installers=(../build/release/*-Setup.exe)
          [ "${#installers[@]}" -gt 0 ] || { echo 'No Windows installer was built'; exit 1; }
          metadata=../build/release/latest.yml
          if [ "$PRERELEASE" = true ]; then metadata=../build/release/beta.yml; fi
          [ -s "$metadata" ] || { echo "Missing updater metadata: $metadata"; exit 1; }
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "$COMMIT_SHA" --title "$RELEASE_TITLE" \
              --generate-notes "${flags[@]}"
          fi
          echo "### Windows download" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
