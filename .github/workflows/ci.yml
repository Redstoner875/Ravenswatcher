name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  talent-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build experimental source-only talent dispatcher
        shell: cmd
        run: app\reader\bench\native\build.cmd
      - name: Test isolated native dispatcher
        run: node app/reader/bench/native/test-dispatch.js
      - uses: actions/upload-artifact@v4
        with:
          name: talent-engine-helper
          path: |
            app/reader/bench/native/bin/talent-call.exe
            app/reader/bench/native/bin/talent-hook.dll
          if-no-files-found: error

      - name: Package complete experimental source build
        shell: pwsh
        run: |
          git archive --format=zip --output=talent-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive talent-source.zip talent-rarity-test-build
          $nativeOutput = 'talent-rarity-test-build/app/reader/bench/native/bin'
          New-Item -ItemType Directory -Force $nativeOutput | Out-Null
          Copy-Item app/reader/bench/native/bin/talent-call.exe $nativeOutput
          Copy-Item app/reader/bench/native/bin/talent-hook.dll $nativeOutput
      - uses: actions/upload-artifact@v4
        with:
          name: talent-rarity-test-build
          path: talent-rarity-test-build/
          if-no-files-found: error
          retention-days: 14
